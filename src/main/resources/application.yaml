server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
rocketmq:
  name-server: ${ROCKETMQ_NAMESERVER:127.0.0.1:9876}
  producer:
    group: hmdp-seckill-producer
    send-message-timeout: ${ROCKETMQ_SEND_TIMEOUT_MS:3000}
seckill:
  topic: ${SECKILL_TOPIC:hmdp-seckill-order}
  consumer-group: ${SECKILL_CONSUMER_GROUP:hmdp-seckill-order-consumer}
  send-timeout-ms: ${ROCKETMQ_SEND_TIMEOUT_MS:3000}
  relay-delay-ms: 1000
  compensation-delay-ms: 5000

shop:
  local-cache:
    maximum-size: ${SHOP_LOCAL_CACHE_MAXIMUM_SIZE:500}
    ttl-seconds: ${SHOP_LOCAL_CACHE_TTL_SECONDS:30}
    retry-delay-ms: 5000
